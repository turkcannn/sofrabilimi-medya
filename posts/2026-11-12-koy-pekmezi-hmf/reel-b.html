<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<!-- TEMA: pop-sticker -->
<style>
:root{--cream:#FFF6E3;--k:#111;--coral:#FF5E3A;--lime:#C5D93A;--gold:#F5B700}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream);color:var(--k);font-family:Poppins,"DejaVu Sans",sans-serif}
.band{position:absolute;top:96px;left:70px;right:70px;display:flex;justify-content:space-between;font-weight:800;font-size:30px;letter-spacing:.08em}
.band b{background:var(--k);color:var(--cream);padding:6px 20px;border-radius:10px}
.scene{inset:270px 70px 470px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.card{border:8px solid var(--k);border-radius:28px;box-shadow:12px 12px 0 var(--k);padding:30px 40px;font-weight:800;text-align:center}
.c1{background:var(--coral);transform:rotate(-3deg);font-size:84px;line-height:1.1}
.c2{background:var(--lime);transform:rotate(2.5deg);font-size:70px;line-height:1.15}
.c3{background:var(--gold);transform:rotate(-2deg);font-size:64px;line-height:1.15}
.big{font-weight:800;font-size:300px;line-height:.9;letter-spacing:-.04em}
.arr{font-size:150px;font-weight:800;color:var(--coral)}
.sw{display:flex;gap:50px;align-items:flex-end}
.jar{width:200px;border:8px solid var(--k);border-radius:20px;box-shadow:10px 10px 0 var(--k);animation:grow 1.2s cubic-bezier(.3,1.4,.4,1) both;position:relative}
@keyframes grow{to{height:var(--h)}}
.jar{height:0}
.jar span{position:absolute;top:-70px;left:-10px;right:-10px;text-align:center;font-weight:800;font-size:40px}
.bubble{display:flex;gap:28px}
.tag{border:8px solid var(--k);border-radius:20px;background:#fff;box-shadow:10px 10px 0 var(--k);padding:22px 34px;font-weight:800;font-size:52px;line-height:1.2;text-align:left}
#sb-sub span{background:var(--k)!important;color:var(--cream)}
#sb-prog{background:var(--coral)!important}
/* KAPAK: DEV RAKAM, sicak zemin */
.cover{background:#D2552F;color:#FFF3E0;gap:6px;padding:0 60px}
.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,220,150,.38),transparent 62%)}
.cover>*{position:relative}
.cover .seri{font-size:32px;font-weight:800;color:#4A1C0C;background:#FFC94A;padding:14px 30px;border-radius:999px;margin-bottom:20px}
.cover .num{font-weight:800;font-size:400px;line-height:.85;letter-spacing:-.05em;text-shadow:0 22px 50px rgba(74,28,12,.35)}
.cover .unit{font-weight:800;font-size:130px;line-height:1;color:#FFC94A}
.cover .alt{font-size:46px;font-weight:700;color:#4A1C0C;background:#FFC94A;border-radius:18px;padding:18px 32px;margin-top:24px;line-height:1.25}
</style></head><body>
<div class="band"><span>@sofrabilimi</span><b>DOĞRU BİLİNEN YANLIŞ</b></div>

<section class="cover">
  <div class="seri">PEKMEZ ÖLÇÜMÜ</div>
  <svg width="380" height="390" viewBox="0 0 300 300"><rect x="80" y="14" width="140" height="34" rx="9" fill="#FFC94A"/><path d="M62 54 h176 v190 a34 34 0 0 1 -34 34 h-108 a34 34 0 0 1 -34 -34z" fill="#5A2A12" stroke="#FFC94A" stroke-width="8"/><rect x="82" y="120" width="136" height="96" rx="12" fill="#FFF3E0"/><circle cx="130" cy="168" r="13" fill="#7B2D8E"/><circle cx="154" cy="158" r="13" fill="#7B2D8E"/><circle cx="176" cy="172" r="13" fill="#7B2D8E"/></svg>
  <div class="num">2 KAT</div>
  <div class="unit">YASAL SINIR</div>
  <div class="alt">pazardan alınan bir pekmezde</div>
</section>

<section class="scene" data-slide="1" data-in="Z" data-cam="pull">
  <div class="card c1 pop" data-t="0">Pazardan alınan bir pekmez</div>
  <div class="arr pop" data-t=".6">↓</div>
  <div class="sw">
    <div class="jar" data-t="0.8" style="--h:200px;background:var(--lime);animation-delay:.8s"><span>SINIR</span></div>
    <div class="jar" data-t="1.4" style="--h:380px;background:var(--coral);animation-delay:1.4s"><span>≈ 2 KAT</span></div>
  </div>
</section>

<section class="scene" data-slide="4" data-in="R" data-cam="push">
  <div class="card c2 slideL" data-t="0">Fazla ısınınca artan madde ölçüldü</div>
  <div class="card c3 pop" data-t="1.2" style="font-size:56px">Gözle ya da tatla anlaşılmaz</div>
</section>

<section class="scene" data-slide="7" data-in="L" data-cam="pan">
  <div class="tag pop" data-t="0">✔ Etiketli</div>
  <div class="tag pop" data-t=".5">✔ Kayıtlı</div>
  <div class="tag pop" data-t="1">✔ İzlenebilir</div>
  <div class="card c1 in" data-t="1.7" style="font-size:64px">Cevap profildeki postta</div>
</section>
</body></html>
