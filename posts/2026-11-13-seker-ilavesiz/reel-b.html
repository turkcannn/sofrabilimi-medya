<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a44;--blue:#4a7fd4;--hl:#FFEB3B;--red:#E0392B;--green:#2E7D32}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:Poppins,"DejaVu Sans",sans-serif;color:var(--ink)}
body:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(74,127,212,.22) 2px,transparent 2px) 0 0/54px 54px,linear-gradient(90deg,rgba(74,127,212,.22) 2px,transparent 2px) 0 0/54px 54px}
.handle{position:absolute;top:100px;width:100%;text-align:center;font-family:Caveat,cursive;font-weight:700;font-size:60px}
.series{position:absolute;top:175px;width:100%;text-align:center;font-weight:800;font-size:32px;letter-spacing:.14em;color:var(--blue)}
.scene{inset:300px 70px 470px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.h{font-weight:800;font-size:96px;line-height:1.1;text-align:center}
.m{font-family:Caveat,cursive;font-weight:700;font-size:80px;line-height:1.1;text-align:center}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);background-size:0 100%;background-repeat:no-repeat;animation:hl .7s ease-out both}
@keyframes hl{to{background-size:100% 100%}}
.in{opacity:0;animation:rise .6s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
svg .d{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.2s ease-out both}
@keyframes draw{to{stroke-dashoffset:0}}
.pk{width:300px;height:380px;position:relative}
.lbl{display:flex;gap:40px}
.col{display:flex;flex-direction:column;align-items:center;gap:20px;font-family:Caveat,cursive;font-size:64px;font-weight:700}
.pen{display:inline-block;animation:bob 1s ease-in-out infinite alternate both}
@keyframes bob{from{transform:translateY(-10px) rotate(-4deg)}to{transform:translateY(10px) rotate(4deg)}}
</style></head><body>
<div class="handle">@sofrabilimi</div>
<div class="series">ETİKET ŞAŞIRTMACASI</div>

<section class="scene" data-slide="1">
  <div class="h in" data-t="0">"Şeker ilavesiz"</div>
  <svg width="760" height="340" viewBox="0 0 760 340"><rect class="d" data-t=".4" x="140" y="20" width="480" height="300" rx="18" fill="none" stroke="#1d2a44" stroke-width="8"/><text x="380" y="120" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="52" fill="#1d2a44">ARKA YÜZ</text><path class="d" data-t="1.2" d="M200 210 H560 M200 250 H500" stroke="#4a7fd4" stroke-width="10" stroke-linecap="round" fill="none"/></svg>
  <div class="h in" data-t="1.6">pekmez <span class="hl" data-t="2.0">çıkarsa?</span></div>
</section>

<section class="scene" data-slide="4">
  <div class="lbl">
    <div class="col in" data-t="0"><svg width="300" height="300" viewBox="0 0 300 300"><rect x="40" y="30" width="220" height="240" rx="14" fill="#FFD54A" stroke="#1d2a44" stroke-width="7"/><text x="150" y="130" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="25" fill="#1d2a44">ŞEKER İLAVESİZ</text><circle class="d" data-t=".8" cx="150" cy="150" r="115" fill="none" stroke="#E0392B" stroke-width="9"/></svg><span style="color:var(--red)">yanlış</span></div>
    <div class="col in" data-t=".3"><svg width="300" height="300" viewBox="0 0 300 300"><rect x="40" y="30" width="220" height="240" rx="14" fill="#FFD54A" stroke="#1d2a44" stroke-width="7"/><text x="150" y="150" text-anchor="middle" font-family="Caveat" font-weight="700" font-size="52" fill="#1d2a44">iddia yok</text><path class="d" data-t="1.2" d="M90 215 L135 250 L215 175" fill="none" stroke="#2E7D32" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="color:var(--green)">doğru</span></div>
  </div>
  <div class="m in" data-t="1.9">farkı <span class="hl" data-t="2.2">içindekiler</span> gösterir</div>
</section>

<section class="scene" data-slide="7">
  <div class="h in" data-t="0">Cevabı</div>
  <div class="h in" data-t=".4"><span class="hl" data-t=".8">profildeki postta</span></div>
  <svg width="260" height="300" viewBox="0 0 260 300" class="pen"><path class="d" data-t="1.0" d="M130 260 C130 180 130 120 130 50 M70 110 L130 40 L190 110" fill="none" stroke="#E0392B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg>
</section>
</body></html>
