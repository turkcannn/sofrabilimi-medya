<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--blue:#cfe3f5;--hl:#FFE94D;--red:#E5384B;--green:#2E9E57}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff;color:var(--ink);font-family:Poppins,"DejaVu Sans",sans-serif}
body:before{content:"";position:absolute;inset:0;background:linear-gradient(var(--blue) 2px,transparent 2px) 0 0/60px 60px,linear-gradient(90deg,var(--blue) 2px,transparent 2px) 0 0/60px 60px}
.band{position:absolute;top:100px;left:70px;right:70px;display:flex;justify-content:space-between;font-family:Caveat,"DejaVu Sans",cursive;font-size:46px;font-weight:700;border-bottom:4px solid var(--ink);padding-bottom:10px}
.band b{color:var(--red)}
.scene{inset:270px 70px 480px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
.big{font-weight:800;font-size:100px;line-height:1.08;text-align:center}
.hand{font-family:Caveat,"DejaVu Sans",cursive;font-weight:700;font-size:70px;text-align:center;line-height:1.1}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 8px}
.rise{opacity:0;animation:rise .55s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:var(--len,900);stroke-dashoffset:var(--len,900);animation:draw var(--d,1s) ease-out both}
@keyframes draw{to{stroke-dashoffset:0}}
.sway{animation:sway 2s ease-in-out infinite both;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(4deg)}}
.card{background:#fff;border:6px solid var(--ink);border-radius:26px;padding:26px 34px;box-shadow:10px 10px 0 var(--ink);width:100%}
.card .h{font-family:Caveat,"DejaVu Sans",cursive;font-size:60px;font-weight:700}
.card .p{font-size:46px;font-weight:700;line-height:1.2}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:30px;width:100%}
#sb-sub span{background:rgba(255,255,255,.92)!important;color:var(--ink)!important;border:3px solid var(--ink)}
#sb-prog{background:var(--red)!important}
</style></head><body>
<div class="band"><span>@sofrabilimi</span><b>ETİKET ŞAŞIRTMACASI</b></div>

<section class="scene" data-slide="1" data-in="L" data-cam="pull">
  <svg width="860" height="420" viewBox="0 0 860 420">
    <g fill="none" stroke="#1f2a44" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path class="draw" style="--len:1400;--d:1.4s" d="M60 380 L60 190 L140 190 L140 120 L220 190 L220 120 L300 190 L300 380 Z"/>
      <path class="draw" style="--len:500;--d:.8s;animation-delay:.6s" d="M110 380 L110 300 L160 300 L160 380"/>
      <rect class="draw" style="--len:900;--d:1s;animation-delay:1s" x="420" y="150" width="190" height="230" rx="18"/>
      <rect class="draw" style="--len:600;--d:.8s;animation-delay:1.5s" x="450" y="230" width="130" height="70" rx="10"/>
    </g>
    <text x="515" y="275" font-family="Caveat,DejaVu Sans" font-size="44" font-weight="700" text-anchor="middle" fill="#1f2a44">ev yapımı</text>
    <path class="draw" style="--len:300;--d:.6s;animation-delay:2s" d="M640 130 q40 -60 80 0 q0 40 -40 40 M680 220 l0 6" stroke="#E5384B" stroke-width="10" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="big rise" data-t=".5">Ev yapımı yazan<br>pakete <span class="hl">güveniyor</span><br>musun?</div>
</section>

<section class="scene" data-slide="4" data-in="D" data-cam="push">
  <div class="pair">
    <div class="card rise" data-t="0" style="border-color:var(--red);box-shadow:10px 10px 0 var(--red)">
      <div class="h" style="color:var(--red)">YANLIŞ</div>
      <div class="p">EV YAPIMI</div>
      <svg width="200" height="90" viewBox="0 0 200 90"><path class="draw" style="--len:260;--d:.5s;animation-delay:1s" d="M20 10 L180 80 M180 10 L20 80" stroke="#E5384B" stroke-width="14" stroke-linecap="round" fill="none"/></svg>
      <div style="font-size:34px;font-weight:600">fabrikada yazılamaz</div>
    </div>
    <div class="card rise" data-t="1.6" style="border-color:var(--green);box-shadow:10px 10px 0 var(--green)">
      <div class="h" style="color:var(--green)">DOĞRU</div>
      <div class="p">EV YAPIMI <span class="hl">TADINDA</span></div>
      <svg width="200" height="90" viewBox="0 0 200 90"><path class="draw" style="--len:260;--d:.5s;animation-delay:2.6s" d="M30 50 L80 80 L170 10" stroke="#2E9E57" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <div style="font-size:34px;font-weight:600">yazılabilir</div>
    </div>
  </div>
  <div class="hand rise" data-t="3.4">asıl güven <span class="hl">etiketin arkasında</span></div>
  <svg width="700" height="120" viewBox="0 0 700 120"><path class="draw sway" style="--len:700;--d:1s;animation-delay:4s" d="M20 60 C200 10 400 110 640 50 M600 20 L650 52 L598 92" stroke="#1f2a44" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
</section>

<section class="scene" data-slide="7" data-in="R" data-cam="pan">
  <div class="hand rise" data-t="0" style="font-size:84px">peki...</div>
  <div class="big rise" data-t=".5" style="font-size:92px"><span class="hl">günlük</span><br><span class="hl">köy</span><br><span class="hl">taze fırınlanmış</span>?</div>
  <svg width="260" height="180" viewBox="0 0 260 180"><circle class="draw" style="--len:700;--d:.9s;animation-delay:2s" cx="130" cy="90" r="70" stroke="#E5384B" stroke-width="10" fill="none"/><text x="130" y="122" text-anchor="middle" font-size="96" font-weight="800" font-family="Poppins,DejaVu Sans" fill="#E5384B" class="rise" data-t="2.4">?</text></svg>
  <div class="hand rise" data-t="3">cevap profildeki postta</div>
</section>
</body></html>
